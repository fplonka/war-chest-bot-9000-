<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>War Chest — vs the ReBeL agent</title>
<style>
  :root {
    --bg: #1a1a1c; --panel: #242427; --panel2: #2c2c30; --line: #3a3a40;
    --ink: #dedee1; --dim: #95959e; --acc: #d0a054; --gold: #d4a44c;
    --white: #ececf0; --black: #4b4b54;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink);
         font: 14px/1.45 ui-sans-serif, system-ui, sans-serif; }
  header { display: flex; align-items: baseline; gap: 16px; padding: 10px 18px;
           background: var(--panel); border-bottom: 1px solid var(--line); }
  header h1 { font-size: 17px; margin: 0; letter-spacing: .5px; }
  #status { flex: 1; color: var(--dim); }
  #status b { color: var(--ink); }
  #newgame { background: var(--acc); border: 0; color: #16161a; font-weight: 600;
             padding: 6px 14px; border-radius: 6px; cursor: pointer; }
  main { display: grid; gap: 14px; padding: 16px 18px; align-items: start;
         grid-template-columns: minmax(0, 1fr) minmax(300px, 440px);
         grid-template-areas:
           "board board"
           "moves hand"
           "log   log"; }
  @media (max-width: 920px) {
    main { grid-template-columns: 1fr; grid-template-areas: "board" "moves" "hand" "log"; }
  }
  #boardwrap { grid-area: board; justify-self: center;
               background: var(--panel); border: 1px solid var(--line);
               border-radius: 10px; padding: 10px 12px 8px; }
  #board { width: 560px; max-width: 100%; height: auto; display: block; }
  #moveswrap { grid-area: moves; }
  #handwrap { grid-area: hand; }
  #logwrap { grid-area: log; }
  .card { background: var(--panel); border: 1px solid var(--line);
          border-radius: 10px; padding: 12px 14px; }
  .card h2 { margin: 0 0 8px; font-size: 12px; text-transform: uppercase;
             letter-spacing: 1px; color: var(--dim); }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .chip { background: var(--panel2); border: 1px solid var(--line);
          border-radius: 999px; padding: 3px 10px; font-size: 13px; }
  .chip b { color: var(--acc); }
  .chip .empty { color: var(--dim); }
  .row { display: flex; justify-content: space-between; gap: 10px; }
  .row .half { flex: 1; }
  dl.zones { margin: 0; }
  .zrow { display: flex; gap: 8px; padding: 2px 0; font-size: 12.5px;
          align-items: baseline; }
  .zrow dt { flex: 0 0 64px; color: var(--dim); font-size: 10.5px;
             text-transform: uppercase; letter-spacing: .6px; }
  .zrow dd { margin: 0; color: var(--ink); }
  .zrow.sub dd { color: var(--dim); }
  .zrow dd .none { font-style: italic; }
  #movelist { display: flex; flex-direction: column; gap: 2px; max-height: 340px;
              overflow-y: auto; }
  .mgroup { margin-top: 8px; font-size: 11px; text-transform: uppercase;
            letter-spacing: 1px; color: var(--gold); }
  .mgroup:first-child { margin-top: 0; }
  button.move { text-align: left; background: var(--panel2); color: var(--ink);
                border: 1px solid var(--line); border-radius: 6px;
                padding: 5px 10px; cursor: pointer; font-size: 13px; }
  button.move:hover { border-color: var(--acc); background: #333338; }
  button.move:disabled { opacity: .45; cursor: default; }
  #log { font-family: ui-monospace, Menlo, monospace; font-size: 12px;
         max-height: 200px; overflow-y: auto; }
  #log div { padding: 1px 0; color: var(--dim); }
  #log div.me { color: var(--ink); }
  #log div.agent { color: #a49a8c; }
  #log div.draw { color: #7fa879; }
  #banner { display: none; font-weight: 700; font-size: 15px; padding: 8px 0; }
  #banner.win { color: #7fa879; } #banner.lose { color: #e06c75; }
  #banner.draw { color: var(--gold); }
  .marker-note { font-size: 11px; color: var(--dim); }
  svg text.coord { fill: #6a6a74; font-size: 9px; }
  svg text.unit { font-size: 12px; font-weight: 700; text-anchor: middle;
                  dominant-baseline: central; }
</style>
</head>
<body>
<header>
  <h1>War Chest</h1>
  <div id="status">loading…</div>
  <button id="newgame">New game</button>
</header>
<main>
  <section id="boardwrap"><svg id="board"></svg></section>
  <section id="moveswrap">
    <div class="card">
      <h2 id="movetitle">Your move</h2>
      <div id="banner"></div>
      <div id="movelist"></div>
    </div>
  </section>
  <section id="handwrap">
    <div class="card">
      <h2>Your hand</h2>
      <div class="chips" id="hand"></div>
      <div class="row" style="margin-top:10px">
        <div class="half">
          <h2>You</h2>
          <dl class="zones" id="yourzones"></dl>
        </div>
        <div class="half">
          <h2>Agent</h2>
          <dl class="zones" id="agentzones"></dl>
        </div>
      </div>
    </div>
  </section>
  <section id="logwrap">
    <div class="card">
      <h2>Game log</h2>
      <div id="log"></div>
    </div>
  </section>
</main>
<script>
"use strict";
const R = 30, SQ3 = Math.sqrt(3);
const ABBR = {"Archer":"Ar","Berserker":"Be","Cavalry":"Ca","Crossbowman":"Cr",
  "Ensign":"En","Footman":"Fo","Knight":"Kn","Lancer":"La","Light Cavalry":"LC",
  "Marshal":"Ma","Mercenary":"Me","Pikeman":"Pi","Scout":"Sc","Swordsman":"Sw",
  "Warrior Priest":"WP","Royal Guard":"RG","Berserker V2":"B2","Footman V2":"F2",
  "Warrior Priest V2":"W2","Royal Coin":"RC"};
const KIND_GROUP = {
  deploy:"Deploy", bolster:"Bolster", claim_initiative:"Claim initiative",
  recruit:"Recruit", pass:"Pass", move:"Move", control:"Control", attack:"Attack",
  archer:"Archer tactic", cavalry_move:"Cavalry tactic",
  cavalry_attack:"Cavalry attack", crossbow:"Crossbowman tactic",
  ensign:"Ensign tactic", lancer:"Lancer tactic",
  light_cavalry:"Light Cavalry tactic", marshal:"Marshal tactic",
  royal_guard:"Royal Guard tactic", footman_tactic:"Footman tactic",
  foot_move:"Footman maneuver", foot_control:"Footman maneuver",
  foot_attack:"Footman maneuver", swordsman_move:"Swordsman follow-up",
  swordsman_decline:"Swordsman follow-up",
  berserk_move:"Berserker chain", berserk_control:"Berserker chain",
  berserk_attack:"Berserker chain", berserk_stop:"Berserker chain",
  merc_move:"Mercenary", merc_control:"Mercenary", merc_attack:"Mercenary",
  merc_decline:"Mercenary", footman_instant_deploy:"Footman V2 deploy",
  footman_instant_decline:"Footman V2 deploy",
  grant_move:"Granted move", grant_attack:"Granted attack",
  grant_control:"Granted control", rg_soak_supply:"Royal Guard defense",
  rg_soak_stack:"Royal Guard defense", draw:"Draw"};

// --- presentation helpers ---

// The engine's Display writes "(spend X)" on face-down plays. The human may
// not know which coin the agent spent (Pass / Claim initiative / Recruit pay
// face-down), so agent log lines must drop it.
const SPEND_RE = / \(spend [^)]*\)$/;
const cleanSpend = s => s.replace(SPEND_RE, "");

// Friendlier tactic wording, e.g. "Archer 3,4=>1,4" -> "Archer shoots 3,4 → 1,4".
// Works from the engine's label + the action kind (buttons have both; log
// lines guess the kind from the label's wording).
function prettyAction(kind, label) {
  const c = label.match(/\d+,\d+/g) || [];
  const a = c[0] || "", b = c[1] || "", t = c[2] || "";
  const arrow = "→";
  switch (kind) {
    case "archer": return `Archer shoots ${a} ${arrow} ${b}`;
    case "cavalry_move": return `Cavalry charges ${a} ${arrow} ${b}`;
    case "cavalry_attack": return `Cavalry attacks ${a} ${arrow} ${b}`;
    case "crossbow": return `Crossbowman shoots ${a} ${arrow} ${b}`;
    case "ensign": return `Ensign directs ${a} ${arrow} ${b}`;
    case "lancer": return `Lancer charges ${a} ${arrow} ${b}, attacks ${t}`;
    case "light_cavalry": return `Light Cavalry dashes ${a} ${arrow} ${b}`;
    case "marshal": return `Marshal orders ${a} to attack ${b}`;
    case "royal_guard": return `Royal Guard moves ${a} ${arrow} ${b}`;
    default: return label;
  }
}
function prettyLogLine(label) {
  let kind = null;
  if (label.startsWith("Archer ")) kind = "archer";
  else if (label.startsWith("Cavalry move ")) kind = "cavalry_move";
  else if (label.startsWith("Cavalry attack ")) kind = "cavalry_attack";
  else if (label.startsWith("Crossbow ")) kind = "crossbow";
  else if (label.startsWith("Ensign ")) kind = "ensign";
  else if (label.startsWith("Lancer ")) kind = "lancer";
  else if (label.startsWith("LightCav ")) kind = "light_cavalry";
  else if (label.startsWith("Marshal: ")) kind = "marshal";
  else if (label.startsWith("RoyalGuard ")) kind = "royal_guard";
  return kind ? prettyAction(kind, label) : label;
}

// The last action that actually MOVED a unit (a deploy places, it does not
// move; an attack keeps the attacker put). Tactics that move are included.
// Parsed from the raw engine label so the prettifier cannot interfere.
const MOVE_LABEL_RE = /^(?:Move|Cavalry move|LightCav|Lancer|Ensign moves|RoyalGuard|Swordsman move|Berserk move|Merc move|Footman move|Granted move)\s+(\d+,\d+)->(\d+,\d+)/;
function lastMove(state) {
  // the most recent action that moved a unit — scans back past round-start
  // draws so the indicator survives them
  for (let k = state.log.length - 1; k >= 0; k--) {
    const last = state.log[k].replace(/^(You|Agent): /, "");
    const m = last.match(MOVE_LABEL_RE);
    if (m) return { from: m[1], to: m[2] };
  }
  return null;
}

let meta = null, state = null, busy = false;

const $ = id => document.getElementById(id);

async function api(path, opts) {
  const r = await fetch(path, opts);
  const j = await r.json();
  if (!r.ok) throw new Error(j.error || ("HTTP " + r.status));
  return j;
}

function centerOf(x, y) { return [R * SQ3 * (x + y / 2), R * 1.5 * y]; }
function hexPoints(cx, cy) {
  const pts = [];
  for (const a of [30, 90, 150, 210, 270, 330]) {
    const t = a * Math.PI / 180;
    pts.push((cx + R * Math.cos(t)).toFixed(2) + "," + (cy + R * Math.sin(t)).toFixed(2));
  }
  return pts.join(" ");
}
function unitAbbr(id) { return ABBR[meta.units[id]] || meta.units[id] || "?"; }

function renderBoard() {
  const svg = $("board");
  const geo = meta.geometry;
  let w = 0, h = 0;
  for (const [x, y] of geo.coords) {
    const [px, py] = centerOf(x, y);
    w = Math.max(w, px); h = Math.max(h, py);
  }
  svg.setAttribute("viewBox", `-36 -36 ${w + 100} ${h + 80}`);
  svg.innerHTML = "";
  const ns = "http://www.w3.org/2000/svg";
  const occ = new Map(state.board.map(o => [o.hex, o]));
  const markers = new Map(Object.entries(state.markers).map(([c, o]) => [geo.hex_of[c], o]));
  const lm = lastMove(state);
  // location 0,1 = your start bases; 2,3 = agent's; 4..9 = neutral
  const locIdx = new Map(Object.entries(geo.locations).map(([li, hex]) => [hex, Number(li)]));
  const locName = li => li <= 1 ? "your start location"
                : li <= 3 ? "agent's start location" : "neutral location";

  for (let i = 0; i < geo.coords.length; i++) {
    const [x, y] = geo.coords[i];
    const [cx, cy] = centerOf(x, y);
    const li = locIdx.get(i);
    const m = markers.get(i);
    // location hexes get a bright outline and a tint by who controls them;
    // plain hexes are dark so the pieces stand out
    let fill = "#2e2e33", stroke = "#43434a", sw = 1.2;
    if (li !== undefined) {
      sw = 2;
      // control is the loudest signal on the board: blue = you, red = agent,
      // grey = neutral, each in both the fill and the outline. The blue and
      // red are matched in weight so they read as one colour pair.
      stroke = m === 0 ? "#a0b8e0" : m === 1 ? "#d99a8e" : "#7a7a84";
      fill = m === 0 ? "#5b83c8" : m === 1 ? "#c05a50" : "#414149";
    }
    const hex = document.createElementNS(ns, "polygon");
    hex.setAttribute("points", hexPoints(cx, cy));
    hex.setAttribute("fill", fill);
    hex.setAttribute("stroke", stroke);
    hex.setAttribute("stroke-width", sw);
    if (li !== undefined) {
      const t = document.createElementNS(ns, "title");
      t.textContent = locName(li) + (m === 0 ? " — you control"
                    : m === 1 ? " — agent controls" : " — neutral");
      hex.appendChild(t);
    }
    svg.appendChild(hex);
    // faint chess-style marker of the last movement: a dot where the unit
    // came from, a halo where it stands now (drawn under the piece)
    if (lm) {
      if (geo.hex_of[lm.from] === i) {
        const dot = document.createElementNS(ns, "circle");
        dot.setAttribute("cx", cx); dot.setAttribute("cy", cy);
        dot.setAttribute("r", 9);
        dot.setAttribute("fill", "rgba(140,220,140,0.4)");
        svg.appendChild(dot);
      }
      if (geo.hex_of[lm.to] === i) {
        const halo = document.createElementNS(ns, "circle");
        halo.setAttribute("cx", cx); halo.setAttribute("cy", cy);
        halo.setAttribute("r", 21);
        halo.setAttribute("fill", "rgba(140,220,140,0.22)");
        svg.appendChild(halo);
      }
    }
    const t = document.createElementNS(ns, "text");
    // coordinate label: centred, tucked under the hex's top edge — clear of
    // the unit disc (centre) and the stack badge (bottom-right)
    t.setAttribute("x", cx); t.setAttribute("y", cy - 20);
    t.setAttribute("text-anchor", "middle");
    t.setAttribute("class", "coord");
    t.textContent = `${x},${y}`;
    svg.appendChild(t);
    // unit stack
    if (occ.has(i)) {
      const o = occ.get(i);
      const me = o.owner === state.human;
      const name = meta.units[o.unit] || "unit " + o.unit;
      const g = document.createElementNS(ns, "g");
      const c = document.createElementNS(ns, "circle");
      c.setAttribute("cx", cx); c.setAttribute("cy", cy);
      c.setAttribute("r", me ? 16 : 15);
      c.setAttribute("fill", me ? "#ececf0" : "#4b4b54");
      c.setAttribute("stroke", me ? "#101014" : "#a8a8b2");
      c.setAttribute("stroke-width", 2);
      g.appendChild(c);
      const u = document.createElementNS(ns, "text");
      u.setAttribute("x", cx); u.setAttribute("y", cy);
      u.setAttribute("class", "unit");
      u.setAttribute("fill", me ? "#1c2029" : "#d8dce6");
      u.textContent = unitAbbr(o.unit);
      g.appendChild(u);
      const tip = document.createElementNS(ns, "title");
      tip.textContent = `${name} (${me ? "you" : "agent"})`
        + (o.height > 1 ? ` · stack ×${o.height}` : "");
      g.appendChild(tip);
      svg.appendChild(g);
      if (o.height > 1) {
        const b = document.createElementNS(ns, "circle");
        b.setAttribute("cx", cx + 11.5); b.setAttribute("cy", cy + 11.5);
        b.setAttribute("r", 7.5);
        b.setAttribute("fill", "#d4a44c");
        b.setAttribute("stroke", "#10131a");
        svg.appendChild(b);
        const bt = document.createElementNS(ns, "text");
        bt.setAttribute("x", cx + 11.5); bt.setAttribute("y", cy + 11.5);
        bt.setAttribute("class", "unit");
        bt.setAttribute("font-size", "9px");
        bt.setAttribute("fill", "#10131a");
        bt.textContent = o.height;
        svg.appendChild(bt);
      }
    }
  }
}

function fmtCounts(d) {
  const items = Object.entries(d).filter(([, n]) => n > 0)
    .map(([id, n]) => `${meta.units[id] || id} ×${n}`);
  return items.length ? items.join(" · ") : "<span class='none'>—</span>";
}
function zoneRow(label, html, sub) {
  return `<div class="zrow${sub ? " sub" : ""}"><dt>${label}</dt><dd>${html}</dd></div>`;
}

function render() {
  const z = state.zones;
  const you = z[state.human], agent = z[state.agent];
  // hand
  const hand = Object.entries(you.hand).map(([id, n]) =>
    n > 0 ? `<span class="chip"><b>${meta.units[id] || id}</b> ×${n}</span>` : null)
    .filter(Boolean).join("");
  $("hand").innerHTML = hand || "<span class='chip empty'>empty</span>";
  // zones, most decision-relevant first; the sub rows are the long-game bookkeeping
  $("yourzones").innerHTML =
    zoneRow("Bag", fmtCounts(you.bag)) +
    zoneRow("Supply", fmtCounts(you.supply)) +
    zoneRow("Face-down", fmtCounts(you.facedown_discard), true) +
    zoneRow("Face-up", fmtCounts(you.faceup_discard), true) +
    zoneRow("Eliminated", fmtCounts(you.eliminated), true);
  $("agentzones").innerHTML =
    zoneRow("Holds",
      `hand ${agent.hand_size} · bag ${agent.bag_size} · face-down ${agent.facedown_count}`) +
    zoneRow("Supply", fmtCounts(agent.supply)) +
    zoneRow("Face-up", fmtCounts(agent.faceup_discard), true) +
    zoneRow("Eliminated", fmtCounts(agent.eliminated), true);
  // status
  const holder = state.initiative === state.human ? "you" : "agent";
  let status = `Round ${state.round} · initiative: <b>${holder}</b>`;
  if (!state.terminal) {
    status += state.to_act === state.human
      ? " · <b>your turn</b>"
      : " · agent's turn";
  }
  $("status").innerHTML = status + ` · you ${state.markers_on_board[state.human]}/6 · ` +
    `agent ${state.markers_on_board[state.agent]}/6` +
    ` · <span class="marker-note">agent: depth ${meta.depth}, ${meta.iters} CFR iters</span>`;
  // moves
  const banner = $("banner");
  if (state.terminal) {
    banner.style.display = "block";
    const w = state.winner;
    banner.className = w === state.human ? "win" : (w === -1 ? "draw" : "lose");
    banner.textContent = w === state.human ? "You win!" :
      (w === -1 ? (state.adjudicated_draw ? "Draw" : "Draw (horizon)") : "The agent wins");
    $("movetitle").textContent = "Game over";
    $("movelist").innerHTML = "";
  } else if (state.is_chance) {
    $("movetitle").textContent = "Drawing…";
    $("movelist").innerHTML = "";
    banner.style.display = "none";
  } else {
    banner.style.display = "none";
    $("movetitle").textContent = state.to_act === state.human
      ? "Your move" : "Agent is thinking…";
    // one section per action kind (the engine emits actions coin-by-coin,
    // so "Deploy" would otherwise repeat for every deployable coin)
    const groups = new Map();
    for (const a of state.actions) {
      const g = KIND_GROUP[a.kind] || a.kind;
      if (!groups.has(g)) groups.set(g, []);
      groups.get(g).push(a);
    }
    let html = "";
    for (const [g, acts] of groups) {
      html += `<div class="mgroup">${g}</div>`;
      for (const a of acts)
        html += `<button class="move" data-code="${a.code}">${prettyAction(a.kind, a.label)}</button>`;
    }
    $("movelist").innerHTML = html;
    if (state.to_act !== state.human) $("movelist").innerHTML = "";
    for (const b of $("movelist").querySelectorAll("button.move"))
      b.onclick = () => move(b.dataset.code);
  }
  // log: the agent's face-down spends stay hidden; tactic wording is
  // friendlier on both sides ("Archer shoots 3,4 → 1,4")
  $("log").innerHTML = state.log.map(l => {
    const isAgent = l.startsWith("Agent");
    const cls = l.startsWith("You") ? "me" : isAgent ? "agent" : "draw";
    let text = l.replace("ClaimInitiative", "Claim initiative");
    if (isAgent) text = cleanSpend(text);
    const body = text.replace(/^(You|Agent): /, "");
    const pretty = prettyLogLine(body);
    return `<div class="${cls}">${text.replace(body, pretty)}</div>`;
  }).reverse().join("");
  renderBoard();
}

async function move(code) {
  if (busy) return;
  busy = true;
  $("movelist").innerHTML = "";
  $("movetitle").textContent = "Agent is thinking…";
  try {
    state = await api("/api/move", {
      method: "POST",
      headers: {"Content-Type": "application/json"},
      body: JSON.stringify({code: Number(code)}),
    });
  } catch (e) {
    $("movetitle").textContent = "Error: " + e.message;
  } finally {
    busy = false;
  }
  render();
}

async function refresh() {
  try { state = await api("/api/state"); render(); }
  catch (e) { $("status").textContent = "error: " + e.message; }
}

async function init() {
  meta = await api("/api/meta");
  $("newgame").onclick = async () => {
    state = await api("/api/new", {method: "POST"});
    render();
  };
  await refresh();
}

init();
</script>
</body>
</html>
