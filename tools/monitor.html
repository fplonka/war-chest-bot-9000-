<!doctype html><meta charset=utf-8><title>warchest runs</title>
<meta name=viewport content="width=device-width,initial-scale=1">
<link rel=icon href="data:,">
<link rel=stylesheet href=/vendor/uPlot.min.css>
<style>
:root{--bg:#fff;--ink:#111;--mut:#666;--line:#ddd}
@media (prefers-color-scheme:dark){:root{--bg:#111;--ink:#e8e8e8;--mut:#999;--line:#333}}
*{box-sizing:border-box}
body{margin:0;display:flex;height:100vh;background:var(--bg);color:var(--ink);
 font:12px/1.4 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
 font-variant-numeric:tabular-nums}
aside{width:250px;flex:none;overflow-y:auto;border-right:1px solid var(--line);padding:8px}
main{flex:1;overflow-y:auto;padding:14px 16px 40px}
button{display:block;width:100%;text-align:left;background:none;color:var(--ink);
 border:0;border-radius:3px;padding:4px 6px;margin-bottom:1px;font:inherit;cursor:pointer}
button:hover{background:var(--line)}
button.on{background:var(--line);font-weight:700}
.sub{display:block;color:var(--mut);font-size:11px;font-weight:400}
.live{color:#20a37a}
h1{font-size:14px;margin:0 0 2px}
h2{font-size:12px;margin:22px 0 6px;color:var(--mut)}
.meta,.none{color:var(--mut);margin:0 0 6px}
.note{margin:0 0 8px}
.delta{display:flex;flex-wrap:wrap;gap:2px 16px;color:var(--mut);margin-bottom:12px}
.delta .hit{color:var(--ink);font-weight:700}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(360px,1fr));gap:10px 18px}
.panel{min-width:0}
.uplot{font:10px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
.u-title{font-size:11px;text-align:left;font-weight:700}
.panel .u-legend{font-size:10px;margin:0}
.u-legend .raw{display:none}
.u-legend th,.u-legend td{padding:0 8px 0 0;border:0}
.u-select{background:#8883}
dl{display:flex;flex-wrap:wrap;gap:0 22px;margin:4px 0}
dt{font-size:11px;color:var(--mut)}
dd{margin:0 0 4px}
pre{max-height:340px;overflow:auto;margin:4px 0;font:inherit;white-space:pre-wrap}
#loglink{margin-left:8px;font-size:11px;color:#3d8bfd}
</style>
<aside id=list></aside>
<main>
 <h1><span id=title></span><a id=loglink target=_blank>train.log</a></h1>
 <p class=meta id=meta></p><p class=note id=note></p>
 <div class=delta id=cfg></div>
 <p class=meta id=charthelp>drag zoom · wheel zoom · middle-drag pan · double-click reset</p>
 <div class=grid id=panels></div>
 <dl id=health></dl>
 <div id=text></div>
</main>
<script src=/vendor/uPlot.iife.min.js></script>
<script>
const COLORS = ["#4e79a7", "#e15759", "#59a14f", "#f28e2b", "#76b7b2",
  "#edc949", "#af7aa1", "#ff9da7", "#9c755f", "#bab0ac", "#8cd17d"];
const MOVE_COLORS = matchMedia("(prefers-color-scheme:dark)").matches
  ? ["#77aadd", "#ee8866", "#44bb99", "#eedd66", "#99ddff", "#cc77aa", "#aaa"]
  : ["#336699", "#cc3311", "#117755", "#997700", "#2288aa", "#882255", "#777"];
const $ = id => document.getElementById(id);
const E = (tag, cls, text) => { const n = document.createElement(tag);
  if (cls) n.className = cls; if (text != null) n.textContent = text; return n; };
let sel = decodeURIComponent(location.hash.slice(1)) || null;
let shape = "", plots = [];

const api = async u => { try { const r = await fetch(u); return r.ok ? r.json() : null; }
                         catch (e) { return null; } };
const fmt = v => v == null ? "—" : Math.abs(v) >= 1e5 || (v && Math.abs(v) < 1e-3)
  ? v.toExponential(2) : String(+v.toPrecision(4));

function ema(y, span = 12) {
  const a = 2 / (span + 1); let p = null;
  return y.map(v => v == null ? null : (p = p == null ? v : a * v + (1 - a) * p));
}

// This is uPlot's official wheel-zoom and drag-pan plugin pattern. Normal drag
// selects a zoom range; wheel zooms around the cursor; middle-drag pans.
function navigation() {
  return {hooks: {ready: u => {
    const over = u.over;
    over.addEventListener("wheel", e => {
      e.preventDefault();
      const x = u.posToVal(u.cursor.left, "x"), span = u.scales.x.max - u.scales.x.min;
      const full = u.data[0], min = full[0], max = full[full.length - 1];
      const next = Math.min(max - min, e.deltaY < 0 ? span * .75 : span / .75);
      const pct = (x - u.scales.x.min) / span;
      let lo = x - pct * next, hi = lo + next;
      if (lo < min) { lo = min; hi = min + next; }
      if (hi > max) { hi = max; lo = max - next; }
      u.setScale("x", {min: lo, max: hi});
    }, {passive: false});
    over.addEventListener("mousedown", e => {
      if (e.button !== 1) return;
      e.preventDefault();
      const start = e.clientX, lo0 = u.scales.x.min, hi0 = u.scales.x.max;
      const units = (hi0 - lo0) / u.bbox.width * devicePixelRatio;
      const move = ev => {
        const full = u.data[0], span = hi0 - lo0;
        let lo = lo0 - units * (ev.clientX - start), hi = lo + span;
        if (lo < full[0]) { lo = full[0]; hi = lo + span; }
        if (hi > full[full.length - 1]) { hi = full[full.length - 1]; lo = hi - span; }
        u.setScale("x", {min: lo, max: hi});
      };
      const up = () => { removeEventListener("mousemove", move); removeEventListener("mouseup", up); };
      addEventListener("mousemove", move); addEventListener("mouseup", up);
    });
    over.addEventListener("dblclick", () => u.setData(u.data));
  }}};
}

function overlays(state) {
  return {hooks: {draw: u => {
    const {ctx, bbox} = u, dpr = devicePixelRatio || 1;
    ctx.save(); ctx.beginPath(); ctx.rect(bbox.left, bbox.top, bbox.width, bbox.height); ctx.clip();
    ctx.lineWidth = dpr; ctx.strokeStyle = "#8886"; ctx.setLineDash([2 * dpr, 3 * dpr]);
    for (const t of state.snaps) {
      const x = u.valToPos(t, "x", true);
      ctx.beginPath(); ctx.moveTo(x, bbox.top); ctx.lineTo(x, bbox.top + bbox.height); ctx.stroke();
    }
    ctx.restore();
  }}};
}

function plotData(p) {
  return [p.x, ...p.s.flatMap(s => s.sm ? [s.y, ema(s.y)] : [s.y]),
    ...p.h.map(h => p.x.map(() => h[1]))];
}

function makePlot(box, p, snaps) {
  const dark = matchMedia("(prefers-color-scheme:dark)").matches;
  const axis = dark ? "#999" : "#666", grid = dark ? "#333" : "#ddd";
  const state = {panel: p, snaps};
  const series = [{label: "training time", value: (u, v) => fmt(v) + " min"}];
  p.s.forEach((s, i) => {
    const colors = p.t === "Move mix" ? MOVE_COLORS : COLORS;
    const stroke = colors[i % colors.length];
    if (s.sm) series.push({label: s.n, class: "raw", stroke, width: 1,
      alpha: .22, auto: false, points: {show: false}, spanGaps: false});
    series.push({label: s.n, stroke, width: 1.5, points: {show: false},
      spanGaps: false,
      value: (u, v, si, idx) => fmt(idx == null ? null : state.panel.s[i].y[idx])});
  });
  p.h.forEach((h, i) => series.push({label: h[0], stroke: COLORS[(p.s.length + i) % COLORS.length],
    width: 1, dash: [5, 5], points: {show: false}}));
  const opts = {title: p.t + " · " + p.y, width: box.clientWidth, height: 230,
    plugins: [navigation(), overlays(state)], scales: {x: {time: false}, y: {}},
    cursor: {drag: {x: true, y: false, setScale: true}}, series,
    axes: [{stroke: axis, grid: {stroke: grid}, values: (u, ticks) => ticks.map(fmt)},
      {stroke: axis, grid: {stroke: grid}, size: 65,
       values: (u, ticks) => ticks.map(fmt)}]};
  if (p.zero) opts.scales.y.range = (u, min, max) => {
    const lo = Math.min(0, min), hi = Math.max(0, max);
    return lo === hi ? [0, 1] : [lo, hi];
  };
  const u = new uPlot(opts, plotData(p), box);
  return {u, box, state};
}

function clearPlots() {
  plots.forEach(p => p.u.destroy()); plots = [];
}

// Scroll position is the whole point of redrawing in place, so a <pre> that the
// user has scrolled keeps its offset unless it was already following the tail.
function setText(el, s) {
  if (el.textContent === s) return;
  const at = el.scrollTop, bottom = at + el.clientHeight >= el.scrollHeight - 4;
  el.textContent = s;
  el.scrollTop = bottom ? el.scrollHeight : at;
}

function render(d) {
  $("loglink").style.display = "";
  $("charthelp").style.display = "";
  $("title").textContent = d.name;
  $("meta").textContent = [d.git, d.epochs + " ReBeL epochs"].filter(Boolean).join(" · ");
  $("note").textContent = d.note || "";
  const log = $("loglink");
  log.href = "/run/" + encodeURIComponent(d.name) + "/train.log";
  log.style.display = d.log ? "" : "none";
  const cfg = $("cfg"); cfg.textContent = "";
  d.cfg.forEach(([k, v, changed]) =>
    cfg.appendChild(E("span", changed ? "hit" : null, k + "=" + v)));

  const grid = $("panels"), key = d.panels.map(p =>
    p.t + ":" + p.s.map(s => s.n).join(",") + ":" + p.h.map(h => h[0]).join(",")).join("|");
  if (key !== shape || plots.length !== d.panels.length) {
    clearPlots(); grid.textContent = "";
    const boxes = d.panels.map(() => { const box = E("div", "panel");
      grid.appendChild(box); return box; });
    plots = d.panels.map((p, i) => makePlot(boxes[i], p, d.snaps));
    shape = key;
  } else {
    d.panels.forEach((p, i) => {
      const q = plots[i], old = q.u.data[0], scale = q.u.scales.x;
      const full = Math.abs(scale.min - old[0]) < 1e-9 &&
        Math.abs(scale.max - old[old.length - 1]) < 1e-9;
      q.state.panel = p; q.state.snaps = d.snaps;
      q.u.setData(plotData(p), full);
    });
  }

  const hl = $("health"); hl.textContent = "";
  d.health.forEach(([k, v]) => { hl.appendChild(E("dt", null, k));
    hl.appendChild(E("dd", null, v)); });

  const text = $("text");
  if (!text.firstChild) ["notes", "train.log"].forEach(h => {
    text.appendChild(E("h2", null, h)); text.appendChild(E("pre")); });
  [d.notes || "", (d.log || "").split("\n").slice(-300).join("\n")].forEach((s, i) => {
    const head = text.children[2 * i], pre = text.children[2 * i + 1];
    head.style.display = pre.style.display = s ? "" : "none";
    setText(pre, s); });
}

function entry(a, name, sub, live) {
  const b = E("button", name === sel ? "on" : null);
  b.appendChild(E("span", null, name));
  const line = E("span", "sub");
  if (live) line.appendChild(E("span", "live", "● "));
  line.appendChild(document.createTextNode(sub));
  b.appendChild(line);
  b.onclick = () => { sel = name; location.hash = encodeURIComponent(name);
                      shape = ""; poll(); };
  a.appendChild(b);
}

function list(runs) {
  const a = $("list"), at = a.scrollTop;
  a.textContent = "";
  runs.forEach(r => entry(a, r.name,
    [r.epochs + " ep", r.minutes + "m", r.phase, r.note].filter(Boolean).join(" · "),
    r.running));
  a.scrollTop = at;
}

async function poll() {
  const runs = await api("/api/runs");
  if (runs) {
    if (!sel && runs.length) sel = runs[0].name;
    list(runs);
  }
  if (!sel) return;
  const d = await api("/api/run/" + encodeURIComponent(sel));
  if (d) render(d);
}

addEventListener("resize", () => plots.forEach(p =>
  p.u.setSize({width: p.box.clientWidth, height: 230})));
addEventListener("hashchange", () => {   // the hash is the deep link, so honour Back
  sel = decodeURIComponent(location.hash.slice(1)) || sel; shape = ""; poll(); });
setInterval(poll, 3000);
poll();
</script>
