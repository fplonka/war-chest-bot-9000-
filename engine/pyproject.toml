[build-system]
requires = ["maturin>=1.0,<2.0"]
build-backend = "maturin"

[project]
name = "warchest"
version = "0.1.0"
requires-python = ">=3.9"
description = "War Chest (2p ranked) rules engine"

[tool.maturin]
# the python extension needs the `python` feature (pulls in pyo3).
features = ["python"]
# only ship the cdylib as the `warchest` module.
module-name = "warchest"
