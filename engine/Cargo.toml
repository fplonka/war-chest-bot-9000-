[package]
name = "warchest-engine"
version = "0.1.0"
edition = "2021"
rust-version = "1.78"

[lib]
name = "warchest"
# cdylib for the python extension module, rlib so the bench binary and tests
# can link the pure-rust API.
crate-type = ["cdylib", "rlib"]

[dependencies]
pyo3 = { version = "0.21", features = ["abi3-py39", "extension-module"], optional = true }

[features]
default = []
python = ["pyo3"]

[[bin]]
name = "bench"
path = "src/bin/bench.rs"

[profile.release]
lto = true
codegen-units = 1
