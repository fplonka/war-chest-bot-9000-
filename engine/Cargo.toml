[package]
name = "warchest-engine"
version = "0.1.0"
edition = "2021"
rust-version = "1.78"

[lib]
name = "warchest"
# cdylib for the python extension module, rlib so the bench binary and tests
# can link the pure-rust API.
crate-type = ["cdylib", "rlib"]

[dependencies]
pyo3 = { version = "0.21", features = ["abi3-py39", "extension-module"], optional = true }
numpy = { version = "0.21", optional = true }
rayon = "1.10"
matrixmultiply = "0.3"
cudarc = { version = "0.17", optional = true, default-features = false, features = ["cuda-12000", "dynamic-loading", "driver", "nvrtc", "cublas"] }

[features]
default = []
python = ["pyo3", "numpy"]
# Phase timers inside the generation loop; adds ~5% overhead.
prof = []
# The CUDA solve service (work package B). Dynamic-loading cudarc needs no
# CUDA toolkit at build time; the kernels are compiled by NVRTC at startup.
# Pick the feature matching the box's CUDA runtime (12.x here).
gpu = ["dep:cudarc"]

[[bin]]
name = "bench"
path = "src/bin/bench.rs"

[[bin]]
name = "rebelbench"
path = "src/bin/rebelbench.rs"

[[example]]
name = "gpu_bench"
path = "examples/gpu_bench.rs"
required-features = ["gpu"]

[[example]]
name = "gpu_gen_bench"
path = "examples/gpu_gen_bench.rs"
required-features = ["gpu"]

[profile.release]
lto = true
codegen-units = 1
