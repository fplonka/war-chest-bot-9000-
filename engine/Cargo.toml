[package]
name = "warchest-engine"
version = "0.1.0"
edition = "2021"
rust-version = "1.78"

[lib]
name = "warchest"
# cdylib for the python extension module, rlib so the bench binary and tests
# can link the pure-rust API.
crate-type = ["cdylib", "rlib"]

[dependencies]
pyo3 = { version = "0.21", features = ["abi3-py39", "extension-module"], optional = true }
numpy = { version = "0.21", optional = true }
rayon = "1.10"
matrixmultiply = "0.3"
parking_lot = "0.12"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
cudarc = { version = "0.17", optional = true, default-features = false, features = ["cuda-version-from-build-system", "dynamic-loading", "driver", "nvrtc", "cublas"] }

[features]
default = []
python = ["pyo3", "numpy"]
# Phase timers inside the generation loop; adds ~5% overhead.
prof = []
# The CUDA solve service (work package B). Dynamic-loading cudarc needs no
# CUDA toolkit at build time; the kernels are compiled by NVRTC at startup.
# Bind to the toolkit on the machine that builds the GPU feature. This matters
# for NVRTC's versioned API: CUDA 13 removed symbols that a CUDA-12 binding
# eagerly loads, even though the kernels themselves are source-compatible.
gpu = ["dep:cudarc"]

# Needs the CUDA feature; without this `cargo test` cannot even build the
# examples, so the whole CPU suite fails on a machine with no GPU.
[[example]]
name = "wave_tape"
required-features = ["gpu"]

[[bin]]
name = "bench"
path = "src/bin/bench.rs"

[[bin]]
name = "rebelbench"
path = "src/bin/rebelbench.rs"

# The arena bot. Archived per experiment, so it is built on its own and copied
# into the bot's directory rather than run from `target/`.
[[bin]]
name = "bot"
path = "src/bin/bot.rs"

[profile.release]
lto = true
codegen-units = 1
